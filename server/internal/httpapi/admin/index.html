<!doctype html>
<html lang="ru">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Помощник: админка</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>

      <aside class="side">

      <main class="main" id="main">

      </main>
    </div>
    <script src="admin.js" type="module"></script>
