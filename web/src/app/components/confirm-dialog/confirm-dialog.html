<dialog
  #dialog
  class="confirm"
  aria-labelledby="confirm-title"
  aria-describedby="confirm-message"
  (click)="onDialogClicked($event)"
  (close)="open.set(false)"
>
  <div class="confirm__body">
    <h2 id="confirm-title" class="confirm__title">{{ title() }}</h2>
    <p id="confirm-message" class="confirm__message">{{ message() }}</p>
    <div class="confirm__actions">
      <button type="button" class="confirm__button" autofocus (click)="open.set(false)">
        {{ cancelLabel }}
      </button>
      <button type="button" class="confirm__button confirm__button--danger" (click)="onConfirm()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</dialog>
