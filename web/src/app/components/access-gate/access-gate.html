<form class="gate" (submit)="$event.preventDefault(); submit()">
  <label class="gate__label" for="access-password">Пароль</label>
  <div class="gate__row">
    <input
      id="access-password"
      class="gate__input"
      type="password"
      autocomplete="current-password"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="go"
      [formField]="gateForm.password"
    />
    <button type="submit" class="gate__button" [disabled]="!canSubmit()">Войти</button>
  </div>
  @if (access.rejected()) {
    <p class="gate__error" role="alert">{{ rejectedText }}</p>
  }
  @if (yandex.available()) {
    <button
      type="button"
      class="gate__yandex"
      [disabled]="yandex.busy()"
      (click)="yandex.begin('login')"
    >
      {{ yandexTexts.signIn }}
    </button>
    <p class="gate__hint">{{ yandexTexts.signInHint }}</p>
  }
  @if (yandex.notice()) {
    <p class="gate__hint" role="status">{{ yandex.notice() }}</p>
  }
</form>
