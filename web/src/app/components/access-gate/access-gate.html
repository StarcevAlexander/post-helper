<form class="gate" (submit)="$event.preventDefault(); submit()">
  <label class="gate__label" for="access-password">Код доступа</label>
  <div class="gate__row">
    <input
      id="access-password"
      class="gate__input"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="go"
      [formField]="gateForm.password"
    />
    <button type="submit" class="gate__button" [disabled]="!canSubmit()">Войти</button>
  </div>
</form>
