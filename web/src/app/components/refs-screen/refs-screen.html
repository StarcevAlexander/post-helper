<div class="screen__body">
  <header class="screen__header">
    <h2 class="screen__title">{{ heading() }}</h2>
    @if (subheading()) {
      <p class="screen__subtitle">{{ subheading() }}</p>
    }
  </header>

  @if (status()?.status === 'done') {
    <p class="screen__hint">{{ texts.intro }}</p>
  }

  <app-ref-gallery [itemId]="id()" />

  @if (refs.error(); as message) {
    <p class="screen__error" role="alert">{{ message }}</p>
  }

  @if (canConfirm()) {
    <button type="button" class="screen__primary" [disabled]="refs.busy()" (click)="onAskConfirm()">
      {{ texts.done }}
    </button>
    <p class="screen__hint">{{ texts.doneHint }}</p>
  }
</div>

<dialog #confirm class="confirm" aria-labelledby="refs-confirm-title">
  <div class="confirm__body">
    <h3 id="refs-confirm-title" class="confirm__title">{{ texts.confirmTitle }}</h3>
    <p class="confirm__text">{{ texts.confirmText }}</p>
    <div class="confirm__actions">
      <button type="button" class="screen__secondary" (click)="onCancel()">
        {{ texts.cancel }}
      </button>
      <button type="button" class="screen__primary" (click)="onOk()">{{ texts.ok }}</button>
    </div>
  </div>
</dialog>
