@if (newest().length > 0) {
  <div class="requests__actions">
    <button type="button" class="requests__button" (click)="onCopyClicked()">
      {{ copyLabel() }}
    </button>
    <button
      type="button"
      class="requests__button requests__button--danger"
      (click)="clearConfirmOpen.set(true)"
    >
      {{ clearLabel }}
    </button>
  </div>
  <ul class="requests__list">
    @for (entry of newest(); track entry.id) {
      <li class="requests__entry">
        <button
          type="button"
          class="requests__summary"
          [attr.aria-expanded]="expandedId() === entry.id"
          [attr.aria-controls]="'request-details-' + entry.id"
          (click)="onEntryClicked(entry.id)"
        >
          <time class="requests__time" [attr.datetime]="entry.createdAt.toISOString()">
            {{ entry.createdAt | date: 'dd.MM.yyyy HH:mm:ss' }}
          </time>
          <span class="requests__description">{{ entry.description }}</span>
          <span class="requests__status requests__status--{{ entry.status }}">
            {{ statusLabels[entry.status] }}: {{ statusSummaries[entry.status] }}
            @if (duration(entry)) {
              · {{ duration(entry) }}
            }
          </span>
        </button>
        @if (expandedId() === entry.id) {
          <dl class="requests__details" [id]="'request-details-' + entry.id">
            <dt>{{ sentLabel }}</dt>
            <dd>{{ entry.sent }}</dd>
            <dt>{{ receivedLabel(entry) }}</dt>
            <dd>{{ entry.received ?? noResponseText }}</dd>
          </dl>
        }
      </li>
    }
  </ul>
} @else {
  <p class="requests__empty">{{ emptyText }}</p>
}

<app-confirm-dialog
  [(open)]="clearConfirmOpen"
  [title]="clearTitle"
  [message]="clearText"
  [confirmLabel]="clearLabel"
  (confirmed)="requestLog.clear()"
/>
