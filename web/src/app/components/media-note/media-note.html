<div class="note">
  <label class="note__label" [for]="'media-note-' + itemId()">{{ texts.noteLabel }}</label>
  <textarea
    class="note__input"
    rows="3"
    [id]="'media-note-' + itemId()"
    [maxLength]="maxLength"
    [placeholder]="texts.notePlaceholder"
    [value]="value()"
    (input)="onInput(note)"
    #note
  ></textarea>
</div>
