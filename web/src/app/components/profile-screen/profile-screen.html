<dialog
  #dialog
  class="screen"
  aria-labelledby="profile-title"
  (click)="onDialogClicked($event)"
  (close)="onDialogClosed()"
>
  <form class="screen__body" novalidate (submit)="$event.preventDefault(); onSubmit()">
    <header class="screen__header">
      <h2 id="profile-title" class="screen__title">{{ title }}</h2>
      <button
        type="button"
        class="screen__close"
        [attr.aria-label]="closeLabel"
        (click)="open.set(false)"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path
            d="M6 6l12 12M18 6L6 18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <p class="screen__hint">{{ hint }}</p>

    @for (step of steps; track step.field) {
      <div class="field">
        <label class="field__label" [for]="'profile-' + step.field">{{ step.label }}</label>
        <textarea
          class="field__input"
          rows="2"
          [id]="'profile-' + step.field"
          [attr.aria-invalid]="errorOf(step.field) ? 'true' : null"
          [attr.aria-describedby]="errorOf(step.field) ? 'profile-error-' + step.field : null"
          [formField]="profileForm[step.field]"
        ></textarea>
        @if (errorOf(step.field); as message) {
          <p class="field__error" role="alert" [id]="'profile-error-' + step.field">
            {{ message }}
          </p>
        }
      </div>
    }

    <button
      type="submit"
      class="screen__primary"
      [disabled]="profileForm().invalid() || chat.busy()"
    >
      {{ submitLabel() }}
    </button>
  </form>
</dialog>
