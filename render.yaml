services:
  - type: web
    name: post-helper-server
    runtime: go
    rootDir: server
    buildCommand: go build -o post-helper .
    startCommand: ./post-helper
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RETENTION_DAYS
        value: "0"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
